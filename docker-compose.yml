version: '3.8'

services:
  # Base de dades MySQL
  db:
    image: mysql:8.0
    container_name: xuxemons-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd-xuxemons
      MYSQL_USER: xuxemons
      MYSQL_PASSWORD: xuxemons
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: xuxemons-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  # Backend Laravel
  laravel:
    build:
      context: ./docker/backend/laravel
      dockerfile: Dockerfile
    container_name: xuxemons-laravel
    restart: always
    working_dir: /var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    volumes:
      - ./backend/laravel:/var/www/html:cached
      - laravel_vendor:/var/www/html/vendor
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cp .env.docker .env &&
            composer install --no-dev --optimize-autoloader &&
            until php -r \"new PDO('mysql:host=db;port=3306;dbname=bd-xuxemons', 'xuxemons', 'xuxemons');\" 2>/dev/null; do echo 'Esperando MySQL...'; sleep 2; done &&
            php artisan migrate --force &&
            apache2-foreground"


  # Frontend Angular
  angular:
    image: node:20
    container_name: xuxemons-angular
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000 --proxy-config proxy.conf.json"
    depends_on:
      - laravel

volumes:
  db_data:
  laravel_vendor:
