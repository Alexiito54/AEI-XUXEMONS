<section class="register-page">
	<div class="register-content">

		<div class="logo-section">
			<img src="images/img_registro.png" alt="XUXEMONS" class="logo-img" loading="eager">
		</div>

		<div class="form-section">
			<h2>INICIAR SESIÓN</h2>

			<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

				<div class="form-group">
					<label for="email">Email</label>
					<input id="email" formControlName="email" type="email" placeholder="email@ejemplo.com"
								 [class.input-error]="emailControl.invalid && emailControl.touched"
								 (blur)="emailControl.markAsTouched()" />
					<div class="error-message" *ngIf="emailControl.invalid && emailControl.touched">
						<small *ngIf="emailControl.errors?.['required']">Email requerido</small>
						<small *ngIf="emailControl.errors?.['email']">Formato email inválido</small>
					</div>
				</div>

				<div class="form-group">
					<label for="password">Contraseña</label>
					<input id="password" formControlName="password" type="password" placeholder="Introduce tu contraseña"
								 [class.input-error]="passwordControl.invalid && passwordControl.touched"
								 (blur)="passwordControl.markAsTouched()" />
					<div class="error-message" *ngIf="passwordControl.invalid && passwordControl.touched">
						<small *ngIf="passwordControl.errors?.['required']">Contraseña requerida</small>
					</div>
				</div>

				<button type="submit" class="btn-register" [disabled]="loading || loginForm.invalid">
					<span *ngIf="loading; else loginText">Entrando...</span>
					<ng-template #loginText>ENTRAR</ng-template>
				</button>

			</form>
		</div>
	</div>
</section>
